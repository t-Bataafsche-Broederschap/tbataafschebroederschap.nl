apiVersion: v3.2.0
kind: DataContract
id: tbb-uitkeringen-naar-afkomst-public
version: 3.0.0
name: Uitkeringen naar herkomst
status: active
description:
  purpose: Hoeveel uitkeringen (en geld) ontvangen mensen van verschillende afkomst?
  limitations: Algemene bijstand PW, geen totaal van alle regelingen. De cijfers tellen
    personen, geen afzonderlijke uitkeringen of eurobedragen. De leeftijdsafbakening
    is 15 jaar tot de AOW-leeftijd, niet alle inwoners. De AOW-leeftijd verandert
    per verslagjaar. Ruwe verhoudingen, niet gecorrigeerd voor leeftijd, geslacht
    of opleiding. Groepsverschillen bewijzen geen oorzaak. Rond 2020 worden enkele
    voormalige Sovjet- en Joegoslavische geboortelanden anders ingedeeld. Dat kan
    de brede Europa/Buiten-Europagroepen beïnvloeden. Laatste meetjaar in deze bron
    is 2024; CBS heeft deze bijstandsindicator per 2026 laten vervallen. Alle uitkeringen
    samen en geld per inwoner blijven onbeantwoord.
team:
  name: t-Bataafsche Broederschap
customProperties:
- property: seriesSemantics
  value:
  - id: bijstand-groepen
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-landen
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
