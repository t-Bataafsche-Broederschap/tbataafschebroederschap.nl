apiVersion: v3.2.0
kind: DataContract
id: tbb-woningbouw-en-woningtekort-public
version: 1.0.0
name: Woningbouw en woningtekort
status: active
description:
  purpose: We lijken een permanent huizentekort te hebben. Is dat ooit anders geweest?
    Hoeveel huizen bouwen we eigenlijk, en hoeveel van die huizen komen terecht bij
    de inheemse, en hoeveel bij andere groepen?
  limitations: De vraag is rechtstreeks door de gebruiker geformuleerd. De term inheemse
    wordt niet als CBS-meetvariabele behandeld; de getoonde groepen volgen expliciete
    CBS-definities. Historische tekortcijfers hebben uiteenlopende methoden en peildata.
    Vanaf 2018 geldt een andere methode; de recente negen ramingen komen uit één versie,
    Primos 2026. Er worden geen tussenliggende jaarwaarden ingevuld. Percentages volgen
    hun bronnoemer, waaronder de gewenste voorraad in Primos 2011. Nieuwbouw is niet
    hetzelfde als netto voorraadgroei. Negatieve saldi blijven staan. CBS gaat in
    2012 over naar BAG en in 2025 naar Levensloop woningen. De woningvoorraad is in
    duizendtallen gepubliceerd. De woonsituatievergelijking betreft uitsluitend zelfstandig
    wonende particuliere huishoudens op 31 december 2022. Herkomst en leeftijd worden
    via de referentiepersoon ingedeeld; gedeelde woningen zijn uitgesloten. De groepen
    zijn geen telling van etnische identiteit en de totale referentiegroep overlapt
    de deelgroepen. Woningbezit is geen nieuwbouwtoewijzing. In de gecontroleerde
    Monitor Bewoonde Nieuwbouw 2021–2023 is geen passende herkomstverdeling gevonden.
    De verdeling van eerste bewoners van nieuwbouw blijft een open onderzoeksvraag.
team:
  name: t-Bataafsche Broederschap
customProperties:
- property: seriesSemantics
  value:
  - id: woningbouw
    unit: woningen per jaar
    definition: CBS-jaarregistraties. Nieuwbouw + overige toevoegingen − overige onttrekkingen
      − sloop + correcties = netto voorraadgroei wanneer alle bronvelden beschikbaar
      zijn. Ontbrekend is geen nul. Negatieve saldi blijven behouden; zij kunnen ook
      samenhangen met registratiewijzigingen. De CBS-bron gaat in 2012 over naar BAG
      en in 2025 naar Levensloop woningen.
    key:
    - period
    - group
  - id: voorraadmutaties
    unit: woningen per jaar
    definition: CBS-jaarregistraties. Nieuwbouw + overige toevoegingen − overige onttrekkingen
      − sloop + correcties = netto voorraadgroei wanneer alle bronvelden beschikbaar
      zijn. Ontbrekend is geen nul. Negatieve saldi blijven behouden; zij kunnen ook
      samenhangen met registratiewijzigingen. De CBS-bron gaat in 2012 over naar BAG
      en in 2025 naar Levensloop woningen.
    key:
    - period
    - group
  - id: woningvoorraad
    unit: woningen
    definition: CBS-eindstanden, gepubliceerd in duizendtallen en omgerekend naar
      woningen. De publicatieprecisie blijft duizend woningen. Niet zonder afrondingsmarge
      gelijkstellen aan het exacte saldo van jaarmutaties.
    key:
    - period
    - group
  - id: tekort-aantal
    unit: woningen
    definition: Afzonderlijke gepubliceerde tekortramingen, geen jaarlijkse telling
      of interpolatie. Historische definities en peildata verschillen. De percentages
      volgen de noemer van hun bron; Primos 2011 gebruikt voor 2006 en 2010 de gewenste
      voorraad. Vanaf 2018 geldt een andere methode. De reeks 2018–2026 komt geheel
      uit Primos 2026 tabel 3.2; daarin worden ook wijzigingen in de leegstandsmeting
      in 2023 en 2025 beschreven.
    key:
    - period
    - group
  - id: tekort-percentage
    unit: '% volgens brondefinitie'
    definition: Afzonderlijke gepubliceerde tekortramingen, geen jaarlijkse telling
      of interpolatie. Historische definities en peildata verschillen. De percentages
      volgen de noemer van hun bron; Primos 2011 gebruikt voor 2006 en 2010 de gewenste
      voorraad. Vanaf 2018 geldt een andere methode. De reeks 2018–2026 komt geheel
      uit Primos 2026 tabel 3.2; daarin worden ook wijzigingen in de leegstandsmeting
      in 2023 en 2025 beschreven. Niet-gepubliceerde percentages blijven ontbreken
      en worden niet uit een andere woningvoorraad berekend.
    key:
    - period
    - group
  - id: koopwoning-aandeel
    unit: '% huishoudens met koopwoning'
    definition: CBS-tabellen 2.1.1a en 2.1.1b, peildatum 31 december 2022. Afzonderlijke
      aandelen binnen herkomst- en leeftijdsgroepen, niet aandelen in alle woningen
      of in nieuwbouw. De referentiepersoon bepaalt de CBS-indeling; gemengde huishoudens
      zijn geen etnisch homogene groep. Totaal Nederland overlapt de afzonderlijke
      groepen en mag er niet bij worden opgeteld.
    key:
    - period
    - group
schema:
- name: research
  logicalType: object
  properties:
  - name: checks
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: id
        logicalType: string
        required: true
      - name: message
        logicalType: string
        required: true
      - name: status
        logicalType: string
        required: true
        enum:
        - value: passed
        - value: limited
        - value: not_comparable
  - name: correlations
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: cells
        logicalType: array
        required: true
        items:
          name: item
          logicalType: object
          required: true
          properties:
          - name: column
            logicalType: string
            required: true
          - name: n
            logicalType: integer
            required: true
          - name: reason
            logicalType: string
            required: true
          - name: row
            logicalType: string
            required: true
          - name: value
            logicalType: string
            required: false
      - name: definition
        logicalType: string
        required: true
      - name: dimension
        logicalType: string
        required: true
      - name: group_ids
        logicalType: array
        required: true
        items:
          name: item
          logicalType: string
          required: true
      - name: method
        logicalType: string
        required: true
        enum:
        - value: pearson
    description: Exploratieve correlaties van groepscijfers, met de exacte groepsselectie
      en het aantal geldige paren per cel.
  - name: definition
    logicalType: string
    required: true
  - name: geometry
    logicalType: object
    required: false
    properties: []
  - name: id
    logicalType: string
    required: true
  - name: inputs
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: capture_id
        logicalType: string
        required: true
      - name: kind
        logicalType: string
        required: true
        enum:
        - value: source_response
        - value: processed_baseline
        - value: reviewed_transcription
      - name: retrieved_at
        logicalType: string
        required: true
      - name: sha256
        logicalType: string
        required: true
      - name: source_id
        logicalType: string
        required: true
  - name: limitations
    logicalType: array
    required: true
    items:
      name: item
      logicalType: string
      required: true
  - name: method_version
    logicalType: string
    required: true
  - name: original_context
    logicalType: string
    required: true
    description: Oorspronkelijke aanleiding als platte tekst. De oorspronkelijke HTML
      blijft in het behoudarchief staan.
  - name: question
    logicalType: string
    required: true
  - name: question_ids
    logicalType: array
    required: true
    items:
      name: item
      logicalType: string
      required: true
  - name: schema_version
    logicalType: integer
    required: true
    enum:
    - value: 2
  - name: series
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: definition
        logicalType: string
        required: true
      - name: id
        logicalType: string
        required: true
      - name: kind
        logicalType: string
        required: true
        enum:
        - value: line
        - value: bar
        - value: scatter
        - value: map
      - name: points
        logicalType: array
        required: true
        items:
          name: item
          logicalType: object
          required: true
          properties:
          - name: estimate
            logicalType: object
            required: false
            properties:
            - name: expenditure_eur
              logicalType: string
              required: true
            - name: expenditure_source_id
              logicalType: string
              required: true
            - name: group_recipients
              logicalType: array
              required: true
              items:
                name: item
                logicalType: string
                required: true
              description: 'Dertien maandultimo''s: december voorafgaand aan het verslagjaar
                tot december van het verslagjaar. Thuiswonende PW-ontvangers jonger
                dan AOW-leeftijd.'
            - name: inhabitants
              logicalType: array
              required: true
              items:
                name: item
                logicalType: string
                required: true
              description: 'Dertien bevolkingsstanden op de eerste van de maand: januari
                verslagjaar tot januari volgend jaar; dezelfde herkomstgroep, alle
                leeftijden.'
            - name: measure
              logicalType: string
              required: true
              enum:
              - value: per_capita
              - value: total
            - name: method
              logicalType: string
              required: true
              enum:
              - value: pw-equal-person-year-cost-v1
            - name: national_recipients
              logicalType: array
              required: true
              items:
                name: item
                logicalType: string
                required: true
              description: Dezelfde dertien maandultimo's voor de landelijke PW-telling.
                Ook onbekende herkomst blijft in het landelijke totaal.
            - name: population_source_id
              logicalType: string
              required: true
            - name: recipients_source_id
              logicalType: string
              required: true
            - name: year
              logicalType: integer
              required: true
            description: Model voor bruto PW-uitgaven per inwoner per jaar. Gelijke
              kosten per ontvangerjaar; jaargemiddelden uit dertien standen met halve
              eindgewichten. Alle leeftijden in de bevolkingsnoemer. Geen gemeten
              groepsbetalingen of netto bankontvangsten.
          - name: group
            logicalType: string
            required: true
            description: Groepssleutel binnen de specifieke reeks, geen universele
              herkomstclassificatie.
          - name: label
            logicalType: string
            required: true
          - name: lower
            logicalType: string
            required: false
          - name: percentage
            logicalType: object
            required: false
            properties:
            - name: cell
              logicalType: string
              required: true
              logicalTypeOptions:
                pattern: ^[A-Z]+[1-9][0-9]*$
            - name: percentage
              logicalType: string
              required: true
            - name: population
              logicalType: string
              required: true
              enum:
              - value: NL-residents-15-to-AOW
            - name: reference_date
              logicalType: string
              required: true
            - name: sheet
              logicalType: string
              required: true
            - name: source_id
              logicalType: string
              required: true
            description: CBS-percentage voor algemene bijstand, inwoners van 15 jaar
              tot AOW-leeftijd, eind september. Per 1.000 is dit percentage maal tien;
              blad, cel en peildatum blijven gebonden. Geen afgeleide absolute teller
              of noemer.
          - name: period
            logicalType: string
            required: true
            description: Bronperiode; peildatum en frequentie staan in de reeksdefinitie.
          - name: ratio
            logicalType: object
            required: false
            properties:
            - name: denominator
              logicalType: string
              required: true
            - name: denominator_date
              logicalType: string
              required: true
            - name: denominator_source_id
              logicalType: string
              required: true
            - name: numerator
              logicalType: string
              required: true
            - name: numerator_date
              logicalType: string
              required: true
            - name: numerator_measure
              logicalType: string
              required: true
            - name: numerator_source_id
              logicalType: string
              required: true
            - name: population
              logicalType: string
              required: true
              enum:
              - value: NL-residents
            description: Herleidbare teller, noemer en afzonderlijke peildata voor
              een verhouding per 1.000 inwoners. De peildata liggen één dag uiteen;
              dit is een expliciete benadering, geen identieke stand.
          - name: reason
            logicalType: string
            required: true
          - name: source_status
            logicalType: string
            required: true
          - name: status
            logicalType: string
            required: true
            enum:
            - value: observed
            - value: missing
            - value: suppressed
            - value: not_applicable
            - value: estimated
          - name: upper
            logicalType: string
            required: false
          - name: value
            logicalType: string
            required: false
            description: Exacte decimalstring in de eenheid van de reeks; null vereist
              een expliciete ontbreekstatus.
          - name: x
            logicalType: string
            required: false
      - name: title
        logicalType: string
        required: true
      - name: unit
        logicalType: string
        required: true
        description: Meeteenheid van alle waarden in deze reeks. Een verhouding vereist
          een passende teller en noemer.
      - name: x_label
        logicalType: string
        required: true
  - name: sources
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: id
        logicalType: string
        required: true
      - name: publisher
        logicalType: string
        required: true
      - name: role
        logicalType: string
        required: true
      - name: title
        logicalType: string
        required: true
      - name: url
        logicalType: string
        required: false
  - name: title
    logicalType: string
    required: true
  dataGranularityDescription: 'Een onderzoeksproduct met afzonderlijke reeksen; waarnemingssleutel
    per reeks: periode en groep.'
  quality:
  - id: public-schema
    name: Public schema
    type: text
    description: De publieke uitvoer voldoet aan het gegenereerde serialisatieschema.
  - id: unique-observations
    name: Unique observations
    type: text
    description: Binnen iedere reeks is periode plus groep uniek.
  - id: value-status
    name: Value and status
    type: text
    description: Een ontbrekende of afgeschermde waarde bevat geen getal; een waargenomen
      waarde is niet null.
