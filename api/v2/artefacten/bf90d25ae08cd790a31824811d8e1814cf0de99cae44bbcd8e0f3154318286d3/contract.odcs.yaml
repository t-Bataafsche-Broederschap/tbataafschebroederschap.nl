apiVersion: v3.2.0
kind: DataContract
id: tbb-hoe-hecht-is-nederland-public
version: 2.0.0
name: Hoe hecht is Nederland?
status: active
description:
  purpose: Nederlanders vertrouwen hun buren, helpen elkaar en zetten zich vrijwillig
    in. Toch namen sociaal contact, hulp en vertrouwen in 2025 tegelijk af. Deze verkenning
    laat zien waar de verbinding sterk is, waar zij dunner wordt en voor wie.
  limitations: De indicatoren hebben eigen meetvragen en onderliggende enquêtes; zij
    vormen geen gemeenschappelijke totaalscore. Wekelijks sociaal contact is een samengestelde
    maat. Er is geen gezamenlijk 95%-interval berekend; een ontbrekende marge wordt
    niet ingevuld. Demografische indelingen overlappen. Vergelijk één indeling tegelijk;
    deze groepsverschillen zijn geen gecorrigeerde persoonsvergelijking of causale
    verklaring. Sterke eenzaamheid blijft een afzonderlijke indicator. Zij wordt niet
    omgekeerd tot een maat voor sociale cohesie. De invoer is een vastgelegde verwerkte
    baseline. De oorspronkelijke bronresponses en alle bronstatussen zijn niet opnieuw
    bevestigd.
team:
  name: t-Bataafsche Broederschap
