apiVersion: v3.2.0
kind: DataContract
id: tbb-verdachten-naar-afkomst-public
version: 1.6.0
name: Verdachten naar afkomst
status: active
description:
  purpose: Hoe verschillen geregistreerde verdachtencijfers naar herkomst en generatie
    door de tijd?
  limitations: Een verdachte is geen veroordeelde. De oude en nieuwe herkomstindelingen
    vormen afzonderlijke reeksen en zijn niet zonder meer vergelijkbaar. De bronstatusvelden
    voor 2023 zijn onderling tegenstrijdig. Zowel de status als de toelichting blijft
    zichtbaar. In de stippenfiguur bepaalt het afgeronde CBS-aandeel onder BRP-inwoners
    de kleur. Absolute brontellingen kunnen ook niet-ingeschreven personen bevatten
    en zijn geen exacte teller voor de stippen. Delictgroepen kunnen overlappen.
team:
  name: t-Bataafsche Broederschap
customProperties:
- property: seriesSemantics
  value:
  - id: historisch-totalSuspects
    unit: personen
    definition: Verdachten zijn geen veroordeelden. Historische en actuele herkomstclassificaties
      blijven gescheiden. Bron per 10.000 is gedeeld door tien.
    key:
    - period
    - group
  - id: historisch-suspectsPer10000
    unit: per 1.000 inwoners
    definition: Verdachten zijn geen veroordeelden. Historische en actuele herkomstclassificaties
      blijven gescheiden. Bron per 10.000 is gedeeld door tien.
    key:
    - period
    - group
  - id: actueel-totalSuspects
    unit: personen
    definition: Verdachten zijn geen veroordeelden. Historische en actuele herkomstclassificaties
      blijven gescheiden. Bron per 10.000 is gedeeld door tien.
    key:
    - period
    - group
  - id: actueel-suspectsPer10000
    unit: per 1.000 inwoners
    definition: Verdachten zijn geen veroordeelden. Historische en actuele herkomstclassificaties
      blijven gescheiden. Bron per 10.000 is gedeeld door tien.
    key:
    - period
    - group
  - id: historisch-spreiding
    unit: per 1.000 inwoners
    definition: Historische CBS-indeling 2022. Absolute aantallen kunnen ook personen
      buiten de BRP omvatten; het cijfer per inwoner betreft personen in de BRP.
    key:
    - period
    - group
  - id: historisch-kwartielen
    unit: per 1.000 inwoners
    definition: Kwartielen met lineaire interpolatie over afzonderlijke herkomstgroepen
      en Nederlandse achtergrond in de historische indeling 2022; overlappende verzamelgroepen
      zijn uitgesloten.
    key:
    - period
    - group
  - id: verdachten-bevolking-groepen
    unit: '% geregistreerde verdachten'
    definition: Bevolking op 1 januari; verdachten geregistreerd in het kalenderjaar.
      Absolute aantallen verdachten kunnen ook personen buiten de BRP bevatten; bevolking
      betreft BRP-inwoners. Aandelen zijn afzonderlijk berekend en niet gecorrigeerd
      voor leeftijd. Verdachten zijn geen veroordeelden.
    key:
    - period
    - group
  - id: verdachten-bevolking-landen
    unit: '% geregistreerde verdachten'
    definition: Bevolking op 1 januari; verdachten geregistreerd in het kalenderjaar.
      Absolute aantallen verdachten kunnen ook personen buiten de BRP bevatten; bevolking
      betreft BRP-inwoners. Aandelen zijn afzonderlijk berekend en niet gecorrigeerd
      voor leeftijd. Verdachten zijn geen veroordeelden.
    key:
    - period
    - group
  - id: stippen-bevolking
    unit: inwoners van 12 jaar en ouder
    definition: CBS 85384NED, stand op 1 januari, totaal minus de twaalf afzonderlijke
      leeftijden 0–11. De leeftijdsafbakening van 12 jaar en ouder is beschreven door
      CBS in Hoe verschillen veiligheid en criminaliteit naar herkomst? Overige landen
      buiten Europa zijn Buiten Europa minus Indonesië, Marokko, Nederlandse Cariben,
      Suriname en Turkije. Totaal Nederland overlapt de deelgroepen.
    key:
    - period
    - group
  - id: stippen-aantal-alle
    unit: personen
    definition: CBS 85658NED, unieke geregistreerde verdachten in het kalenderjaar.
      De absolute brontelling kan ook niet-ingeschreven personen omvatten. Geen inwonerteller
      voor het inkleuren van een bevolkingsgroep. Delictgroepen overlappen en mogen
      niet worden opgeteld.
    key:
    - period
    - group
  - id: stippen-per1000-alle
    unit: per 1.000 inwoners van 12 jaar en ouder
    definition: Rechtstreeks gepubliceerd CBS-cijfer per 10.000 inwoners van 12 jaar
      en ouder, gedeeld door tien. De teller van dit aandeel betreft uitsluitend personen
      in de BRP; de absolute brontelling heeft een bredere populatie. Afgeronde bronverhouding,
      geen terugberekende exacte inwonertelling. Niet leeftijdsgestandaardiseerd.
    key:
    - period
    - group
  - id: stippen-aantal-vermogen
    unit: personen
