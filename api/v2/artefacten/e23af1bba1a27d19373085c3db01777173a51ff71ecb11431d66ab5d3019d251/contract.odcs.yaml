apiVersion: v3.2.0
kind: DataContract
id: tbb-uitkeringen-naar-afkomst-public
version: 3.1.0
name: Uitkeringen naar herkomst
status: active
description:
  purpose: Hoeveel uitkeringen (en geld) ontvangen mensen van verschillende afkomst?
  limitations: 'De leeftijdsafbakening is 15 jaar tot de AOW-leeftijd, niet alle inwoners.
    De AOW-leeftijd verandert per verslagjaar. Ruwe verhoudingen, niet gecorrigeerd
    voor leeftijd, geslacht of opleiding. Groepsverschillen bewijzen geen oorzaak.
    Rond 2020 worden enkele voormalige Sovjet- en Joegoslavische geboortelanden anders
    ingedeeld. Dat kan de brede Europa/Buiten-Europagroepen beïnvloeden. Laatste meetjaar
    in deze bron is 2024; CBS heeft deze bijstandsindicator per 2026 laten vervallen.
    Alle uitkeringen samen en geld per inwoner blijven onbeantwoord. De geldtoedeling
    2022–2024 veronderstelt gelijke gemiddelde kosten per ontvangerjaar. De vijf groepen
    tellen thuiswonenden, terwijl de landelijke besteding ook instellingen en adreslozen
    omvat; een representatieve herkomstverdeling en eventuele AIO-partnerrest zijn
    niet afzonderlijk getoetst. Geldmodel: nominale euro per inwoner van alle leeftijden;
    gemeten CBS-frequenties: 15 jaar tot AOW-leeftijd. Geen rechtstreeks identieke
    noemers. Geen gemeten netto bankontvangsten, inflatiecorrectie of vastgesteld
    betrouwbaarheidsinterval. Voor 2022–2024 zijn complete jaarinputs beschikbaar.
    Er zijn geen afzonderlijke geldschattingen voor de zes herkomstlanden en geen
    terugrekening vóór 2022.'
team:
  name: t-Bataafsche Broederschap
customProperties:
- property: seriesSemantics
  value:
  - id: bijstand-groepen
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-landen
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-landen-geboren-nl
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-landen-geboren-buiten-nl
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-landelijk
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-meetmomenten
    unit: ontvangers per 1.000 inwoners
    definition: Algemene bijstand volgens de Participatiewet, inwoners van 15 jaar
      tot de AOW-leeftijd, stand op eind september. CBS publiceert het aandeel binnen
      dezelfde bevolkingsgroep; dit percentage maal tien geeft ontvangers per 1.000
      inwoners binnen dezelfde leeftijdsafbakening. IOAW, IOAZ en Bbz zijn niet inbegrepen.
      Geen leeftijdsstandaardisatie. De AOW-leeftijd verschilt per verslagjaar.
    key:
    - period
    - group
  - id: bijstand-uitgaven-schatting
    unit: euro per inwoner per jaar
    definition: Bruto landelijke PW-besteding toegerekend naar het aandeel in thuiswonende
      ontvangerjaren jonger dan AOW, gedeeld door de gemiddelde bevolking van dezelfde
      herkomst, alle leeftijden. Jaargemiddelden uit dertien maandstanden met halve
      eindgewichten. Gelijke gemiddelde kosten per ontvangerjaar en representatieve
      herkomstverdeling voor niet-meegetelde ontvangers zijn modelaannames. Geen gemeten
      groepsbetalingen of netto bankontvangsten; nominale euro's, niet voor inflatie
      gecorrigeerd.
    key:
    - period
    - group
  - id: bijstand-uitgaven-groep-totaal
    unit: euro per jaar
    definition: Landelijke bruto PW-besteding toegerekend volgens het aandeel van
      de groep in de jaargemiddelde thuiswonende ontvangers jonger dan AOW. Geschat,
      geen gemeten groepsbetalingen; nominale euro's.
    key:
    - period
    - group
  - id: bijstand-uitgaven-landelijk
    unit: euro per jaar
    definition: Gerealiseerde gemeentelijke PW-bestedingen uit SiSa, som van gemeenten.
      Inclusief belastingen en premies, exclusief IOAW, IOAZ, Bbz en loonkostensubsidies.
      Geen rijksbudget of netto bankontvangsten.
    key:
    - period
    - group
  - id: bijstand-uitgaven-landelijk-per-inwoner
    unit: euro per inwoner per jaar
    definition: Geregistreerde landelijke bruto PW-besteding gedeeld door de jaargemiddelde
      bevolking van Nederland, alle leeftijden inclusief onbekende herkomst. Jaargemiddelde
      uit dertien maandstanden met halve eindgewichten.
    key:
    - period
    - group
schema:
- name: research
  logicalType: object
  properties:
  - name: checks
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: id
        logicalType: string
        required: true
      - name: message
        logicalType: string
        required: true
      - name: status
        logicalType: string
        required: true
        enum:
        - value: passed
        - value: limited
        - value: not_comparable
  - name: definition
    logicalType: string
    required: true
  - name: geometry
    logicalType: object
    required: false
    properties: []
  - name: id
    logicalType: string
    required: true
  - name: inputs
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: capture_id
        logicalType: string
        required: true
      - name: kind
        logicalType: string
        required: true
        enum:
        - value: source_response
        - value: processed_baseline
        - value: reviewed_transcription
      - name: retrieved_at
        logicalType: string
        required: true
      - name: sha256
        logicalType: string
        required: true
      - name: source_id
        logicalType: string
        required: true
  - name: limitations
    logicalType: array
    required: true
    items:
      name: item
      logicalType: string
      required: true
  - name: method_version
    logicalType: string
    required: true
  - name: original_context
    logicalType: string
    required: true
    description: Oorspronkelijke aanleiding als platte tekst. De oorspronkelijke HTML
      blijft in het behoudarchief staan.
  - name: question
    logicalType: string
    required: true
  - name: question_ids
    logicalType: array
    required: true
    items:
      name: item
      logicalType: string
      required: true
  - name: schema_version
    logicalType: integer
    required: true
    enum:
    - value: 2
  - name: series
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: definition
        logicalType: string
        required: true
      - name: id
        logicalType: string
        required: true
      - name: kind
        logicalType: string
        required: true
        enum:
        - value: line
        - value: bar
        - value: scatter
        - value: map
      - name: points
        logicalType: array
        required: true
        items:
          name: item
          logicalType: object
          required: true
          properties:
          - name: estimate
            logicalType: object
            required: false
            properties:
            - name: expenditure_eur
              logicalType: string
              required: true
            - name: expenditure_source_id
              logicalType: string
              required: true
            - name: group_recipients
              logicalType: array
              required: true
              items:
                name: item
                logicalType: string
                required: true
              description: 'Dertien maandultimo''s: december voorafgaand aan het verslagjaar
                tot december van het verslagjaar. Thuiswonende PW-ontvangers jonger
                dan AOW-leeftijd.'
            - name: inhabitants
              logicalType: array
              required: true
              items:
                name: item
                logicalType: string
                required: true
              description: 'Dertien bevolkingsstanden op de eerste van de maand: januari
                verslagjaar tot januari volgend jaar; dezelfde herkomstgroep, alle
                leeftijden.'
            - name: measure
              logicalType: string
              required: true
              enum:
              - value: per_capita
              - value: total
            - name: method
              logicalType: string
              required: true
              enum:
              - value: pw-equal-person-year-cost-v1
            - name: national_recipients
              logicalType: array
              required: true
              items:
                name: item
                logicalType: string
                required: true
              description: Dezelfde dertien maandultimo's voor de landelijke PW-telling.
                Ook onbekende herkomst blijft in het landelijke totaal.
            - name: population_source_id
              logicalType: string
              required: true
            - name: recipients_source_id
              logicalType: string
              required: true
            - name: year
              logicalType: integer
              required: true
            description: Model voor bruto PW-uitgaven per inwoner per jaar. Gelijke
              kosten per ontvangerjaar; jaargemiddelden uit dertien standen met halve
              eindgewichten. Alle leeftijden in de bevolkingsnoemer. Geen gemeten
              groepsbetalingen of netto bankontvangsten.
          - name: group
            logicalType: string
            required: true
            description: Groepssleutel binnen de specifieke reeks, geen universele
              herkomstclassificatie.
          - name: label
            logicalType: string
            required: true
          - name: lower
            logicalType: string
            required: false
          - name: percentage
            logicalType: object
            required: false
            properties:
            - name: cell
              logicalType: string
              required: true
              logicalTypeOptions:
                pattern: ^[A-Z]+[1-9][0-9]*$
            - name: percentage
              logicalType: string
              required: true
            - name: population
              logicalType: string
              required: true
              enum:
              - value: NL-residents-15-to-AOW
            - name: reference_date
              logicalType: string
              required: true
            - name: sheet
              logicalType: string
              required: true
            - name: source_id
              logicalType: string
              required: true
            description: CBS-percentage voor algemene bijstand, inwoners van 15 jaar
              tot AOW-leeftijd, eind september. Per 1.000 is dit percentage maal tien;
              blad, cel en peildatum blijven gebonden. Geen afgeleide absolute teller
              of noemer.
          - name: period
            logicalType: string
            required: true
            description: Bronperiode; peildatum en frequentie staan in de reeksdefinitie.
          - name: ratio
            logicalType: object
            required: false
            properties:
            - name: denominator
              logicalType: string
              required: true
            - name: denominator_date
              logicalType: string
              required: true
            - name: denominator_source_id
              logicalType: string
              required: true
            - name: numerator
              logicalType: string
              required: true
            - name: numerator_date
              logicalType: string
              required: true
            - name: numerator_measure
              logicalType: string
              required: true
            - name: numerator_source_id
              logicalType: string
              required: true
            - name: population
              logicalType: string
              required: true
              enum:
              - value: NL-residents
            description: Herleidbare teller, noemer en afzonderlijke peildata voor
              een verhouding per 1.000 inwoners. De peildata liggen één dag uiteen;
              dit is een expliciete benadering, geen identieke stand.
          - name: reason
            logicalType: string
            required: true
          - name: source_status
            logicalType: string
            required: true
          - name: status
            logicalType: string
            required: true
            enum:
            - value: observed
            - value: missing
            - value: suppressed
            - value: not_applicable
            - value: estimated
          - name: upper
            logicalType: string
            required: false
          - name: value
            logicalType: string
            required: false
            description: Exacte decimalstring in de eenheid van de reeks; null vereist
              een expliciete ontbreekstatus.
          - name: x
            logicalType: string
            required: false
      - name: title
        logicalType: string
        required: true
      - name: unit
        logicalType: string
        required: true
        description: Meeteenheid van alle waarden in deze reeks. Een verhouding vereist
          een passende teller en noemer.
      - name: x_label
        logicalType: string
        required: true
  - name: sources
    logicalType: array
    required: true
    items:
      name: item
      logicalType: object
      required: true
      properties:
      - name: id
        logicalType: string
        required: true
      - name: publisher
        logicalType: string
        required: true
      - name: role
        logicalType: string
        required: true
      - name: title
        logicalType: string
        required: true
      - name: url
        logicalType: string
        required: false
  - name: title
    logicalType: string
    required: true
  dataGranularityDescription: 'Een onderzoeksproduct met afzonderlijke reeksen; waarnemingssleutel
    per reeks: periode en groep.'
  quality:
  - id: public-schema
    name: Public schema
    type: text
    description: De publieke uitvoer voldoet aan het gegenereerde serialisatieschema.
  - id: unique-observations
    name: Unique observations
    type: text
    description: Binnen iedere reeks is periode plus groep uniek.
  - id: value-status
    name: Value and status
    type: text
    description: Een ontbrekende of afgeschermde waarde bevat geen getal; een waargenomen
      waarde is niet null.
